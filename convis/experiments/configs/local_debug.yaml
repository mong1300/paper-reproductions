# 로컬(MacBook) 디버깅용 - 작은 모델, 이미지 2장
# 목적: 파이프라인이 도는지 확인. 성능은 보지 않는다.

model_id: llava-hf/llava-interleave-qwen-0.5b-hf      # 작은 VLM (예: BLIP-base)
t2i_id: stabilityai/sd-turbo
dtype: float16
device: mps

prompt: "Please describe this image in detail."
caption_max_tokens: 256
max_new_tokens: 64

num_images: 10
image_seed: 42
model_seed: 42

caption_num: 4
num_steps: 1

method: convis
alpha: 1
lam: 0.1

